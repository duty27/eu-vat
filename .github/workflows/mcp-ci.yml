name: MCP CI

# The MCP server bundles the Node library's source and generated data (node/src), so a change there must test it too.
on:
  push:
    branches: [main]
    paths: ["mcp/**", "node/src/**", ".github/workflows/mcp-ci.yml"]
  pull_request:
    paths: ["mcp/**", "node/src/**", ".github/workflows/mcp-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      # Typecheck, bundle the library into dist/server.js, then start that built file and call every tool over
      # stdio with the SDK's own client, including every row of the shared test vectors.
      - run: npm test
