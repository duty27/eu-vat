name: Data freshness

# The three libraries are built from data/eu-standard-vat-rates.json, a copy of the file Duty27 publishes at
# https://duty27.com/data/eu-standard-vat-rates.json. Every day this compares the two. If the published rates
# changed, it prepares a release as a PULL REQUEST: new snapshot, regenerated data in all three libraries, one new
# version for all three, a changelog entry and release notes.
#
# It never merges and never publishes. A person reviews the pull request (a rate change is a claim about the law),
# merges it, and pushes the three release tags.
#
# One-time repository setting: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 6 * * *" # every day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write       # push the data-refresh branch
  pull-requests: write  # open or update the pull request

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare the release if the published rates changed
        id: prepare
        env:
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: node scripts/prepare-release.mjs

      # Pull requests opened with the default token do not start other workflows, so the usual CI would never run on
      # this one. Build and test all three libraries here instead, and open nothing if that fails (the failed job is
      # the alert).
      - name: Build and test all three libraries from the new data
        if: steps.prepare.outputs.changed == 'true'
        run: ./build.sh all

      - name: Open or update the pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          branch=data-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A data node python java CHANGELOG.md
          git commit -m "Update EU VAT rate data, release $VERSION"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" \
              --title "Update EU VAT rate data ($VERSION)" --body-file "$NOTES"
          else
            gh pr edit "$branch" --title "Update EU VAT rate data ($VERSION)" --body-file "$NOTES"
          fi
