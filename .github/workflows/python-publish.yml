name: Python publish

# Publishes duty27-eu-vat to PyPI when a tag like python-v0.1.1 is pushed (git tag python-v0.1.1 && git push --tags),
# using PyPI "trusted publishing": GitHub proves to PyPI which repository and workflow this is, so there is NO PyPI
# token stored anywhere.
#
# One-time setup on pypi.org, BEFORE the first release (PyPI allows this for a project that does not exist yet): your
# account, "Publishing", "Add a new pending publisher": project name duty27-eu-vat, owner duty27, repository eu-vat,
# workflow python-publish.yml, environment pypi. Then create an environment named "pypi" in the GitHub repository's
# settings (optionally with a required reviewer, so a release needs an approval click).
on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        working-directory: python
        run: |
          TAG="${GITHUB_REF_NAME#python-v}"
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag python-v$TAG does not match python/pyproject.toml version $VERSION"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
        working-directory: python
      - run: twine check python/dist/*
      - run: PYTHONPATH=python/src python -W error -m unittest discover -s python/tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/duty27-eu-vat
    permissions:
      id-token: write # lets the job prove its identity to PyPI
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
