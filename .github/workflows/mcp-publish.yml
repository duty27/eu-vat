name: MCP publish

# Publishes @duty27/eu-vat-mcp to npm, then lists it in the MCP Registry, when a tag like mcp-v0.1.1 is pushed (git tag mcp-v0.1.1 && git push --tags;
# the mcp- prefix leaves room for the node-, python- and java- releases from the same repo), using npm "trusted
# publishing": GitHub proves to npm which repository and workflow this is, so there is NO npm token stored
# anywhere, and the package page shows a verified "built from this commit" provenance badge.
#
# One-time setup on npmjs.com, after the first release (which is done by hand): the package's Settings,
# "Trusted Publisher", GitHub Actions, organization "duty27", repository "eu-vat", workflow "mcp-publish.yml".
on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read
  id-token: write # lets the job prove its identity to npm

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: The tag must match the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag mcp-v$TAG does not match mcp/package.json version $VERSION"
            exit 1
          fi
          SERVER="$(node -p "const s=require('./server.json'); s.version + ' ' + s.packages[0].version")"
          if [ "$SERVER" != "$VERSION $VERSION" ]; then
            echo "mcp/server.json versions ($SERVER) do not match package.json version $VERSION"
            exit 1
          fi
      - run: npm test
      - run: npm publish --provenance --access public

      # List this version in the official MCP Registry (registry.modelcontextprotocol.io) as io.github.duty27/eu-vat.
      # github-oidc: the registry trusts GitHub's proof that this job runs in the duty27 organisation, so no token
      # is stored. The registry checks that the npm package's mcpName matches server.json, so this must run after
      # npm publish. The publisher binary is pinned and its checksum checked.
      - name: Install mcp-publisher
        run: |
          curl -sSfL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
