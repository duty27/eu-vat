name: Python CI

on:
  push:
    branches: [main]
    paths: ["python/**", "data/**", "scripts/**", "build.sh", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["python/**", "data/**", "scripts/**", "build.sh", ".github/workflows/python-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Warnings are errors, so a deprecation cannot slip in. Standard library only: nothing to install.
      - run: PYTHONPATH=src python -W error -m unittest discover -s tests

  # What users get is the wheel, so build it and test THAT, installed alone into a clean environment (build.sh does
  # exactly this, locally too).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: ./build.sh python
