name: Node CI

on:
  push:
    branches: [main]
    paths: ["node/**", ".github/workflows/node-ci.yml"]
  pull_request:
    paths: ["node/**", ".github/workflows/node-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      # Builds the ESM and CommonJS outputs, then runs the tests against them, including installing the
      # package by name and checking what the published tarball contains.
      - run: npm test
