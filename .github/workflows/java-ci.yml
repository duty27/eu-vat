name: Java CI

on:
  push:
    branches: [main]
    paths: ["java/**", "data/**", "scripts/**", ".github/workflows/java-ci.yml"]
  pull_request:
    paths: ["java/**", "data/**", "scripts/**", ".github/workflows/java-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Compiles for Java 11 whichever JDK runs it, runs the tests, builds the jar.
      - run: mvn -B verify
